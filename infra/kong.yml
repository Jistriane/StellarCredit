_format_version: "3.0"
_transform: true

services:
  - name: score-service
    url: http://host.docker.internal:8080
    routes:
      - name: score-route
        paths:
          - /api/v1/score

  - name: risk-service
    url: http://host.docker.internal:8000
    routes:
      - name: risk-route
        paths:
          - /api/v1/risk

  - name: pix-service
    url: http://host.docker.internal:3001
    routes:
      - name: pix-route
        paths:
          - /api/v1/pix

  - name: elisa-os
    url: http://host.docker.internal:8001
    routes:
      - name: elisa-route
        paths:
          - /api/v1/elisa
