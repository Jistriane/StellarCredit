apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stellarcredit-ingress
  namespace: stellarcredit
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.stellarcredit.io
    - app.stellarcredit.io
    secretName: stellarcredit-tls
  rules:
  - host: api.stellarcredit.io
    http:
      paths:
      - path: /api/v1/score
        pathType: Prefix
        backend:
          service:
            name: score-service
            port:
              number: 8080
      - path: /api/v1/risk
        pathType: Prefix
        backend:
          service:
            name: risk-service
            port:
              number: 8000
      - path: /api/v1/pix
        pathType: Prefix
        backend:
          service:
            name: pix-service
            port:
              number: 3001
      - path: /api/v1/elisa
        pathType: Prefix
        backend:
          service:
            name: elisa-service
            port:
              number: 8001
  - host: app.stellarcredit.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-frontend
            port:
              number: 3000
