[package]
name = "credit-score"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "20.0.0"

[dev-dependencies]
soroban-sdk = { version = "20.0.0-rc.2", features = ["testutils"] }
arbitrary = "1.3.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[profile.test]
panic = "unwind"
