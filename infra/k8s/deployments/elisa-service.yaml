apiVersion: apps/v1
kind: Deployment
metadata:
  name: elisa-service
  namespace: stellarcredit
spec:
  replicas: 2
  selector:
    matchLabels:
      app: elisa-service
  template:
    metadata:
      labels:
        app: elisa-service
    spec:
      containers:
      - name: elisa-service
        image: stellarcredit/elisa-service:latest
        ports:
        - containerPort: 8001
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: stellarcredit-secrets
              key: openai-api-key
        - name: SCORE_SERVICE_URL
          value: "http://score-service:8080"
        - name: RISK_SERVICE_URL
          value: "http://risk-service:8000"
        - name: LOAN_SERVICE_URL
          value: "http://loan-service:8082"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: elisa-service
  namespace: stellarcredit
spec:
  selector:
    app: elisa-service
  ports:
  - port: 8001
    targetPort: 8001
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: elisa-service-hpa
  namespace: stellarcredit
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: elisa-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
